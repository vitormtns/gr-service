spring:
  main:
    banner-mode: "off"
  datasource:
    hikari:
      maximum-pool-size: 8
      minimum-idle: 0
      connection-timeout: 10000
  sql:
    init:
      mode: never

app:
  security:
    supabase:
      mode: HMAC
      algorithm: HS256
      issuer: https://auth.example.test/auth/v1
      hmac-secret: test-only-hmac-key-with-at-least-32-bytes
      audiences: authenticated
      accepted-token-roles: authenticated
      clock-skew: 1s

management:
  endpoint:
    health:
      show-details: never
