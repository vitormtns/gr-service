server:
  port: ${SERVER_PORT:8080}

app:
  security:
    supabase:
      mode: ${SUPABASE_AUTH_MODE:JWKS}
      algorithm: ${SUPABASE_AUTH_ALGORITHM:ES256}
      issuer: ${SUPABASE_AUTH_ISSUER:http://127.0.0.1:54321/auth/v1}
      jwks-uri: ${SUPABASE_AUTH_JWKS_URI:http://127.0.0.1:54321/auth/v1/.well-known/jwks.json}
      audiences: ${SUPABASE_AUTH_AUDIENCES:authenticated}
      accepted-token-roles: ${SUPABASE_AUTH_TOKEN_ROLES:authenticated}
      clock-skew: ${SUPABASE_AUTH_CLOCK_SKEW:30s}

management:
  endpoint:
    health:
      show-details: when-authorized
