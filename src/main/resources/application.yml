spring:
  application:
    name: gr-service
  servlet:
    encoding:
      charset: UTF-8
      force: true
  jackson:
    time-zone: UTC
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:1}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT:30000}
  sql:
    init:
      mode: never

app:
  database:
    schema: ${DATABASE_SCHEMA:app}
    runtime-role: ${DATABASE_RUNTIME_ROLE:app_api}
herd:
  dashboard:
    maximum-custom-range-days: ${HERD_DASHBOARD_MAXIMUM_CUSTOM_RANGE_DAYS:366}
  reproduction:
    default-gestation-days: ${HERD_REPRODUCTION_DEFAULT_GESTATION_DAYS:283}
  pending-work:
    weighing-due-days: ${HERD_PENDING_WORK_WEIGHING_DUE_DAYS:90}
    calving-upcoming-days: ${HERD_PENDING_WORK_CALVING_UPCOMING_DAYS:14}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-} correlationId:%X{correlationId:-} userId:%X{userId:-} tenantId:%X{tenantId:-}]"

---
spring:
  config:
    activate:
      on-profile: "!local & !test"

app:
  security:
    supabase:
      mode: ${SUPABASE_AUTH_MODE:JWKS}
      algorithm: ${SUPABASE_AUTH_ALGORITHM:ES256}
      issuer: ${SUPABASE_AUTH_ISSUER:}
      jwks-uri: ${SUPABASE_AUTH_JWKS_URI:}
      hmac-secret: ${SUPABASE_AUTH_JWT_SECRET:}
      audiences: ${SUPABASE_AUTH_AUDIENCES:authenticated}
      accepted-token-roles: ${SUPABASE_AUTH_TOKEN_ROLES:authenticated}
      clock-skew: ${SUPABASE_AUTH_CLOCK_SKEW:30s}
